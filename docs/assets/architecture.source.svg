<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOURCE FILE — the one place the architecture diagram is edited.

  `npm run assets` turns this into four rendered copies, which are the files that
  actually get shown:

    docs/public/architecture-light.svg   GitHub in its light theme
    docs/public/architecture-dark.svg    GitHub in its dark theme
    docs/public/architecture.svg         npm, and anything that strips <picture>
    docs/index.md                        inline, follows the VitePress theme toggle

  Geometry and labels only: no colours, no <style>. Everything is expressed through
  the class contract that docs/.vitepress/theme/custom.css defines — .node,
  .node-accent, .edge, .edge-accent, .edge-dashed, .label-title, .label-mono,
  .label-muted — and the generator supplies a matching palette per output. The
  generator refuses a source that carries its own fill/stroke or a <style> block.

  The shape here is the family's three boxes plus one thing they do not have: the
  human, drawn on the path rather than beside it. That placement is the diagram's
  whole argument — the message does not reach the SMTP server unless a person says
  so — and it is why the gate sits between the two accented edges instead of
  hanging off the server box as a note.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How smtp-mcp sits between an MCP client and an SMTP server</title>
  <desc id="arch-desc">An MCP client speaks stdio to smtp-mcp. Every message passes a recipient allowlist and a human confirmation before smtp-mcp hands it to an SMTP server over TLS.</desc>

  <defs>
    <marker id="arch-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
    <marker id="arch-arrow-accent" class="accent" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
  </defs>

  <rect class="node" x="20" y="70" width="160" height="80" rx="10" />
  <text class="label-title" x="100" y="103" text-anchor="middle">MCP client</text>
  <text class="label-muted" x="100" y="123" text-anchor="middle">Claude, Codex, …</text>

  <rect class="node-accent" x="275" y="55" width="170" height="110" rx="10" />
  <text class="label-title" x="360" y="90" text-anchor="middle">smtp-mcp</text>
  <text class="label-muted" x="360" y="110" text-anchor="middle">7 tools, 3 of them send</text>
  <text class="label-muted" x="360" y="128" text-anchor="middle">recipient allowlist</text>
  <text class="label-muted" x="360" y="146" text-anchor="middle">off until SMTP_ALLOW_SEND</text>

  <rect class="node" x="550" y="70" width="150" height="80" rx="10" />
  <text class="label-title" x="625" y="103" text-anchor="middle">SMTP</text>
  <text class="label-muted" x="625" y="123" text-anchor="middle">any submission server</text>

  <path class="edge-accent" d="M180,110 L267,110" marker-end="url(#arch-arrow-accent)" />
  <text class="label-mono" x="223" y="98" text-anchor="middle">stdio</text>

  <path class="edge-accent" d="M445,110 L542,110" marker-end="url(#arch-arrow-accent)" />
  <text class="label-mono" x="493" y="98" text-anchor="middle">SMTP</text>
  <text class="label-muted" x="493" y="130" text-anchor="middle">TLS</text>

  <!-- Centred on x=525 rather than on the middle of the SMTP edge: the dashed
       arrow has to reach that edge without running through the "TLS" label
       sitting under it at x=493. -->
  <rect class="node-accent" x="442" y="200" width="166" height="56" rx="10" />
  <text class="label-title" x="525" y="223" text-anchor="middle">A person</text>
  <text class="label-muted" x="525" y="242" text-anchor="middle">approves every message</text>

  <!-- Pointing up, into the path. The approval is what lets the message
       continue; an arrow the other way would read as the server merely
       notifying somebody, which is the thing this server does not do. -->
  <path class="edge-accent edge-dashed" d="M525,196 L525,122" marker-end="url(#arch-arrow-accent)" />

  <text class="label-muted" x="525" y="276" text-anchor="middle">The model cannot answer for them.</text>

  <text class="label-muted" x="360" y="302" text-anchor="middle">Its counterpart imap-mcp reads mail and cannot send. This one sends and cannot read.</text>
</svg>
